    branch: main
    sha: "6af1289fcfc981ffae1bff407e524ca2ac37306d"
    version: "1.127.2-SNAPSHOT"
    groupId: dev.ikm.tinkar
    depends-on:
      - subproject: komet-bom
        relationship: build

  tinkar-composer:
