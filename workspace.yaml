# workspace.yaml — ike-komet-ws
# ══════════════════════════════════
#
# ike-komet-ws
#
# Bootstrap:
#   git clone https://github.com/<org>/ike-komet-ws.git
#   cd ike-komet-ws
#   mvn ws:init
#   mvn clean install

schema-version: "1.0"
generated: 2026-04-24

defaults:
  branch: main
  maven-version: "4.0.0-rc-5"

subprojects:
  # Add subprojects with: mvn ws:add -Drepo=<git-url>

  ike-commonmark-attributes:
    description: >
      Pandoc-style {.class #id} attribute extension for commonmark-java, aligned with AsciiDoc roles
    repo: https://github.com/ikmdev/ike-commonmark-attributes.git
    version: "1.0.0-SNAPSHOT"
    groupId: network.ike.platform
    depends-on:
      - subproject: komet-bom
        relationship: build
    sha: "677af256c1ceb67d6c820ab0da7b34fd3e85f76a"
# Optional: IntelliJ project settings shared across collaborators.
# Uncomment and set to have `ws:scaffold-upgrade-*` enforce these values in
# .idea/misc.xml on every run. Useful when the project uses
# --enable-preview (set language-level to JDK_NN_PREVIEW).
# ide:
#   language-level: JDK_25_PREVIEW
#   jdk-name: "25"

  komet-bom:
    description: >
      komet-bom subproject.
    repo: https://github.com/ikmdev/komet-bom.git
    branch: main
    sha: "8faf039985dd78ce05cf5f3bcb32ac0663bf3595"
    version: "3.0.7-SNAPSHOT"
    groupId: dev.ikm.komet
    depends-on: []

  tinkar-core:
