#
# ike-komet-ws
#
# Bootstrap:
#   git clone https://github.com/<org>/ike-komet-ws.git
#   cd ike-komet-ws
#   mvn ws:init
#   mvn clean install

schema-version: "1.0"
generated: 2026-04-24

defaults:
  branch: main
  maven-version: "4.0.0-rc-5"

subprojects:
  # Add subprojects with: mvn ws:add -Drepo=<git-url>

  ike-commonmark-attributes:
    description: >
      Pandoc-style {.class #id} attribute extension for commonmark-java, aligned with AsciiDoc roles
    repo: https://github.com/ikmdev/ike-commonmark-attributes.git
    version: "1.0.0-SNAPSHOT"
    groupId: network.ike.platform
    depends-on:
      - subproject: komet-bom
        relationship: build

# Optional: IntelliJ project settings shared across collaborators.
