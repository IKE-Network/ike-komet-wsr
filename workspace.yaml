schema-version: "1.0"
generated: 2026-04-24

defaults:
  branch: main
  maven-version: "4.0.0-rc-5"

subprojects:
  # Add subprojects with: mvn ws:add -Drepo=<git-url>

  ike-commonmark-attributes:
    description: >
      Pandoc-style {.class #id} attribute extension for commonmark-java, aligned with AsciiDoc roles
    repo: https://github.com/ikmdev/ike-commonmark-attributes.git
    branch: main
    sha: "e211a1d6838096157da912457474ae97e392bd63"
    version: 1.0.0-SNAPSHOT
    groupId: network.ike.platform
    depends-on:
      - subproject: komet-bom
        relationship: build

  komet-claude-plugin:
    description: >
      komet-claude-plugin subproject.
    repo: https://github.com/knowledge-graphlet/komet-claude-plugin.git
    branch: main
    version: 1-SNAPSHOT
    groupId: network.ike.komet
    depends-on:
      - subproject: komet-bom
        relationship: build
        version-property: komet-bom.version
      - subproject: tinkar-composer
        relationship: build

  komet-example-rules-plugin:
    description: >
      komet-example-rules-plugin subproject. Minimal RuleProvider rule-pack
      template (ike-issues#626).
    repo: https://github.com/knowledge-graphlet/komet-example-rules-plugin.git
    branch: main
    version: 1-SNAPSHOT
    groupId: network.ike.komet
    depends-on:
      - subproject: komet-bom
        relationship: build
        version-property: komet-bom.version

  complex-clause-plugin:
    description: >
      complex-clause-plugin subproject. Komet plugin for Layer-2 / computable-logic
      complex-concept clauses (supra-DL) that exceed OWL EL++, explicated to CQL
      (ike-issues#628).
    repo: https://github.com/knowledge-graphlet/complex-clause-plugin.git
    branch: feature/claude-assistant
    version: 1-SNAPSHOT
    groupId: network.ike.komet
    depends-on:
      - subproject: komet-bom
        relationship: build
        version-property: komet-bom.version
      - subproject: tinkar-composer
        relationship: build
# Optional: IntelliJ project settings shared across collaborators.
