# Build-report acceptance ledger (ike-issues#978).
# Keys are stable finding identities from the ike-build-report-extension;
# counts are expected observations per session. Semantics: observed equal
# to count lists under ACCEPTED; above surfaces the delta under
# ATTENTION; below surfaces a RATCHET opportunity. See the
# dev-build-report-extension design note (ike-lab-documents) and
# IKE-WORKSPACE.md "Accepted Maven 4 warning".
mode: gate
accepted:
  - key: model-problem/bom-import-from-reactor
    count: 10
    reason: >
      The workspace BOM (komet-bom) is a living member of the working
      set — accepted by design (IKE-WORKSPACE.md, ike-issues#977).
      Count is the ten members importing komet-bom at the reactor
      version, derived and source-keyed; Maven's console warning shows
      only an unstable subset, so the derived count is the number of
      record. Tenth importer komet-grpc-plugin accepted 2026-08-11
      (flagged by the receipt as observed 10 vs accepted 9 on the
      extension's first wired-in run).
    since: 2026-08-11
  - key: repository/metadata-resolve-failed/spring-release-e22ad65be0b5fee6143d584bba6f2b61b37bb6bf
    count: 2
    reason: >
      Maven 4 probes each remote repository for /.meta/prefixes.txt;
      repo.spring.io/release answers 401 because Spring retired the
      open release repository. The repository is declared by a
      third-party POM in the dependency graph, not by any member of
      this working set, so there is nothing here to remove — and
      nothing is actually resolved from it. Surfaced on the CI agent
      only; a local build reaches its Nexus mirror first.
    since: 2026-08-14
  - key: repository/metadata-resolve-failed/mavengems-51da717cfb6c8ccc8113d76d8e4a2aaa714a0f55
    count: 2
    reason: >
      Same prefix probe against a `mavengem:https://rubygems.org`
      repository, which core Maven has no connector for — it needs the
      mavengem extension the declaring third-party POM assumes. Again
      declared outside this working set and never resolved from.
    since: 2026-08-14
